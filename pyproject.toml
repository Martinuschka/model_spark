[project]
name = "model-spark"
version = "0.1.0"
description = "An interactive Rich CLI powered by AutoGluon tabular AutoML"
readme = "README.md"
authors = [
    { name = "Martinuschka", email = "95043342+Martinuschka@users.noreply.github.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "autogluon-tabular[catboost,lightgbm,xgboost]>=1.4.0,<1.5.0",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.1.0,<2.3.0",
    "rich>=13.9.4,<14.0.0",
    "torch>=2.14.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
model_spark = "model_spark.main:run"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
